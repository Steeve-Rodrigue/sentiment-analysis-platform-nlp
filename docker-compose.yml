# docker/docker-compose.yml
#
# Pas de Kafka -- le pipeline producteur/consommateur simule tourne
# via une asyncio.Queue en memoire (USE_KAFKA=false, le defaut, voir
# app/core/config.py et app/services/local_stream_service.py). Aucune
# base de donnees non plus -- le projet n'utilise aucune persistance
# (choix de conception explicite).
#
# Pour retester/demontrer le vrai chemin Kafka (kafka_service.py /
# producer_simulator.py / realtime/streaming.py) : repasser
# USE_KAFKA=true ci-dessous et faire tourner un broker Kafka quelque
# part (ex. `docker run apache/kafka:3.7.0 ...` en mode KRaft, comme
# le faisait ce fichier avant -- voir git history) en pointant
# KAFKA_BOOTSTRAP_SERVERS dessus.

services:
  backend:
    build:
      context: .
      dockerfile: source/backend/Dockerfile
    container_name: globatrend-backend
    ports:
      - "8000:8000"
    environment:
      - USE_KAFKA=false

  frontend:
    build:
      context: .
      dockerfile: source/frontend/Dockerfile
    container_name: globatrend-frontend
    ports:
      - "3000:3000"
    environment:
      # Used by browser-side code (forms, live chart) -- must stay a
      # URL reachable from the VIEWER'S machine, never "backend:8000".
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
      # Used by server-rendered code (the /models page) running
      # inside this container -- reaches the backend over the
      # Docker network.
      - API_BASE_URL_INTERNAL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
